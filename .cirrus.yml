task:
  name: clang7-Debug-ClangTidy-libstdc++
  container:
    image: silkeh/clang:7
  build_script:
  - apt-get update
  - apt-get install --assume-yes cmake libbz2-dev libpng-dev libfreetype6-dev libz-dev git libx11-dev libxrandr-dev libudev-dev libgl1-mesa-dev clang-tidy-7
  - pwd
  - clang++ --version
  - ls /usr/bin/clang*
  - cmake --version
  - export CXX=`which clang++`
  - export CC=`which clang`
  - mkdir build
  - cd build
  - cmake -D CLANGTIDY:PATH=`which clang-tidy-7` -D ENABLE_CLANG_TIDY:BOOL=ON -D CMAKE_BUILD_TYPE:STRING=Debug ..
  - VERBOSE=1 cmake --build . -- -j2
  test_script:
  - pwd
  - cd build
  - ctest -j2
