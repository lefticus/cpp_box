task:
  name: gcc8-Release-FullBuild
  container:
    image: gcc:8
  build_script:
  - apt-get update
  - apt-get install --assume-yes cmake libbz2-dev libpng-dev libfreetype6-dev libz-dev git libx11-dev libxrandr-dev libudev-dev libgl1-mesa-dev
  - pwd
  - g++ --version
  - cmake --version
  - export CXX=`which g++`
  - export CC=`which gcc`
  - mkdir build
  - cd build
  - cmake -D CMAKE_BUILD_TYPE:STRING=Release ..
  - VERBOSE=1 cmake --build . -- -j2
  test_script:
  - pwd
  - cd build
  - ctest -j2

